<body>
<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>
<script>(()=>{
'use strict';
const M11='https://cestuve.github.io/Module11/';
const IMG={
 santiagoHead:"https://cestuve.github.io/Module11/Santiago_Headshot.png",
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 training:'https://cestuve.github.io/module9/Staff_Training_Room.png',
 community:'https://cestuve.github.io/module9/Community_Meeting_Room.png',
 consultation:'https://cestuve.github.io/module9/Client_Consultation_Room.png',
 assessmentRoom:'https://cestuve.github.io/module6/Assessment_Resource_Room.png',
 mariaFull:M11+'Maria_Fullbody.png',mariaHead:M11+'Maria_Headshot.png',
 danielFull:M11+'Daniel_Fullbody.png',danielHead:M11+'Daniel_Headshot.png',
 santiagoNeutral:M11+'Santiago_Neutral.png',santiagoGuarded:M11+'Santiago_Guarded.png',
 santiagoTalking:M11+'Santiago_Talking.png',santiagoFrustrated:M11+'Santiago_Frustrated.png',
 santiagoThoughtful:M11+'Santiago_Thoughtful.png',santiagoHopeful:M11+'Santiago_Hopeful.png'
};
const sections=[
 ['Welcome','Meet Santiago and preview your MI training'],
 ['What Is MI?','Collaborative conversations about change'],
 ['Spirit of MI','PACE and the four processes'],
 ['Understanding Readiness','Needs, context, and barriers'],
 ['Core Skills: OARS','Questions, affirmations, reflections, summaries'],
 ['Reflective Listening & Empathy','Listen for meaning and emotion'],
 ['Ambivalence & Change Talk','Recognize two sides of change'],
 ['DARN-CAT','Explore reasons and readiness'],
 ['Responding to Discord','Stay curious without arguing'],
 ['MI in Practice & Complete','Apply skills and reflect']
];
const KEY='harborPointModule11_scene1_v1';
let state={completed:Array(10).fill(false),currentSection:-1,finalReflections:{}};
try{const st=JSON.parse(localStorage.getItem(KEY)||'null');if(st){if(Array.isArray(st.completed))state.completed=sections.map((_,i)=>!!st.completed[i]);if(Number.isInteger(st.currentSection))state.currentSection=st.currentSection;if(st.finalReflections)state.finalReflections=st.finalReflections;}}catch(e){}
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),status=document.getElementById('srStatus');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function escapeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderMenu(){const done=state.completed.filter(Boolean).length;menu.innerHTML=`<div class="menu-progress" role="status">${done} of 10 sections complete</div>`+sections.map((s,i)=>`<button type="button" class="menu-item ${state.completed[i]?'completed':''}" data-jump="${i}" ${i===state.currentSection?'aria-current="page"':''} >${i+1}. ${escapeText(s[0])}<span>${escapeText(s[1])}</span>${state.completed[i]?'<span class="menu-check" aria-hidden="true">✓</span>':''}</button>`).join('');}
function setCurrent(n){state.currentSection=n;hud.classList.remove('hidden');save();renderMenu()}

function labelAllAnswerOptions(){
 document.querySelectorAll('#modalContent .choices').forEach(group=>{
  [...group.children].filter(b=>b.matches('button')).forEach((b,i)=>{
   const desired=String.fromCharCode(65+i)+'.';
   const title=b.querySelector('.choice-title');
   if(title){if(!title.textContent.trim().startsWith(desired))title.textContent=desired+' '+title.textContent.trim().replace(/^[A-Z]\.\s*/, '');}
   else {const html=b.innerHTML.trim();if(!/^[A-Z]\.\s*/.test(b.textContent.trim()))b.innerHTML='<span class="answer-prefix" aria-hidden="true">'+desired+' </span>'+html;}
  });
 });
}
const answerLabelObserver=new MutationObserver(()=>labelAllAnswerOptions());
answerLabelObserver.observe(document.getElementById('modalContent'),{childList:true,subtree:false});
function openModal(html){modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');document.getElementById('modalPanel').scrollTop=0;closeModalBtn.focus();}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
closeModalBtn.addEventListener('click',closeModal);
modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
menuToggle.addEventListener('click',()=>{let closed=menu.classList.toggle('hidden');menuToggle.setAttribute('aria-expanded',String(!closed));menu.setAttribute('aria-hidden',String(closed));});
function portrait(img,name,quote){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${name} headshot"><div><strong>${name}</strong><p>“${quote}”</p></div></div>`}
function titleIntro(){hud.classList.add('hidden');state.currentSection=-1;save();main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 11</span><h1>Motivational Interviewing</h1><div class="intro-rule"></div><p class="intro-lead">What do you do when a client is not sure they want to change?</p><p class="intro-copy">This week, you'll meet Santiago, a new client who has agreed to talk about his alcohol use but isn't convinced that he needs treatment. You'll learn how motivational interviewing (MI) uses partnership, empathy, and thoughtful conversation to help clients explore their own reasons for change.</p><p class="intro-copy">As you practice, remember: Your goal is not to win an argument or persuade Santiago to accept a particular decision. Your goal is to listen, support autonomy, and help him consider what matters to him.</p><div class="button-row"><button class="primary-btn" type="button" data-action="exterior">Return to Harbor Point →</button></div></div></section>`;}
function exterior(){closeModal();setCurrent(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%"><span class="mini-label">Module 11 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>Maria asked you to arrive before Santiago's first appointment. She wants to introduce a different way of talking with clients about change.</p></div><button class="hotspot" type="button" data-action="maria-scene" aria-label="Enter Harbor Point and meet Maria" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}

function mariaIntro(){openModal(`<h2>Welcome Back to Harbor Point</h2>${portrait(IMG.mariaHead,'Maria',"Our new client, Santiago, is coming in today. He agreed to an appointment, but that doesn't mean he's ready to change. If we start by telling him what he needs to do, we may miss the chance to understand him.")}<p>Motivational interviewing (MI) is a collaborative, person-centered approach that helps people explore ambivalence and strengthen their own motivation for change.</p><p>When you meet with Santiago, listen for how he describes his situation. His own concerns, goals, and experiences will guide the conversation. Daniel is going to walk you through the aspects of MI this week.</p><div class="button-row center"><button class="primary-btn" type="button" data-action="daniel-scene">Meet with Daniel →</button></div>`)}

function danielIntro(){openModal(`<h2>Listen Before You Lead</h2>${portrait(IMG.danielHead,'Daniel',"Santiago's provider suggested he talk with us about alcohol use. We know a little about why he was referred, but we don't yet know how he sees the situation. Listen carefully before drawing conclusions.")}<div class="teaching-card"><h3>What We Know So Far</h3><p>Santiago Rivera, 32, is attending an initial appointment after a referral from his primary care provider. The referral followed a discussion about alcohol use, poor sleep, and stress. This is his first visit to Harbor Point.</p><p><strong>What we don't know yet:</strong> What matters most to Santiago, what he wants from this visit, or whether he is considering any change</p></div><p>Listen for Santiago's own description of his experience. Avoid labeling him or assuming that arriving for an appointment means he has decided to stop drinking.</p><div class="button-row center"><button class="primary-btn" data-action="santiago-scene">Meet Santiago →</button></div>`)}
function santiagoScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Santiago has arrived for his first visit.</div><img class="character" src="${IMG.santiagoNeutral}" alt="Santiago standing in the consultation room" style="left:50%;transform:translateX(-50%);bottom:-3%;height:73vh"><button class="character-hotspot" type="button" aria-label="Speak with Santiago" data-action="santiago-first" style="left:50%;transform:translateX(-50%);bottom:2%;width:33%;height:67%"></button></div></section>`}
function santiagoFirst(){openModal(`<h2>A First Conversation</h2><div class="quote-card quote-with-headshot"><img src="${IMG.santiagoHead}" alt="Santiago with a guarded expression"><div><strong>Santiago</strong><p>“My doctor thought I should come talk to somebody. I'm here, but I don't really think my drinking is a big problem. I work, pay my bills, and take care of things.”</p></div></div><h3>How would you respond?</h3><p>Choose the response that best opens a collaborative conversation without judging or persuading Santiago.</p><div class="question-block"><div class="choices"><button class="choice-btn" type="button" data-answer="0"><span class="choice-title">A. Correct him</span><span class="choice-text">“Your doctor wouldn't have referred you unless your drinking was a serious problem.”</span></button><button class="choice-btn" type="button" data-answer="1"><span class="choice-title">B. Invite his perspective</span><span class="choice-text">“You weren't convinced this visit was necessary. What has this experience been like for you?”</span></button><button class="choice-btn" type="button" data-answer="2"><span class="choice-title">C. Reassure him</span><span class="choice-text">“Don't worry. Lots of people drink more than they should, and treatment can fix that.”</span></button><button class="choice-btn" type="button" data-answer="3"><span class="choice-title">D. Push for agreement</span><span class="choice-text">“Can you at least admit that you need to cut back?”</span></button></div><div id="firstFeedback" class="inline-question-feedback" aria-live="polite"></div></div>`)}
function respond(button){const v=Number(button.dataset.answer),ok=v===1;button.classList.add(ok?'correct':'incorrect');const target=document.getElementById('firstFeedback');target.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');target.innerHTML=ok?`<strong>Correct</strong><p>This response reflects Santiago's uncertainty and invites him to tell his story. It demonstrates curiosity rather than confrontation. You are beginning with engagement, not assuming his treatment goal.</p><div class="button-row"><button class="primary-btn" data-action="complete-welcome">Continue →</button></div>`:`<strong>Try a more collaborative approach.</strong><p>${v===0?'Correcting Santiago could increase defensiveness before you understand his viewpoint.':v===2?'Reassurance and a promise that treatment will fix things overlook Santiago’s concerns and assume he needs a solution.':'Pressing Santiago to admit a problem shifts the conversation toward an argument.'} Look for a response that communicates understanding and invites his perspective.</p>`;if(ok)document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}

function miIntro(){closeModal();setCurrent(1);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Work with Daniel to learn more about MI and how you can use it to help Santiago.</div><img class="character" src="${IMG.danielFull}" alt="Daniel standing in the training room" style="left:50%;transform:translateX(-50%);bottom:-2%;height:70vh"><button class="character-hotspot" type="button" aria-label="Talk with Daniel about motivational interviewing" data-action="mi-explain" style="left:50%;transform:translateX(-50%);bottom:2%;width:30%;height:64%"></button></div></section>`;}
function miExplain(){openModal(`<h2>What Is MI?</h2>${portrait(IMG.danielHead,'Daniel',"MI helps us have conversations about change without taking over the decision. Instead of telling Santiago why he should stop drinking, we make space for him to explore what matters to him.")}<div class="teaching-card"><h3>A Different Kind of Conversation</h3><p>MI is a collaborative, person-centered, goal-oriented counseling approach that helps people explore and resolve ambivalence about change. It strengthens motivation by drawing out clients’ own reasons, values, hopes, and confidence.</p><p>MI is not arguing, lecturing, tricking, or simply getting a client to agree with a counselor. The client maintains the right to make decisions about change.</p></div><div class="info-grid"><div class="info-card"><strong>Partnership, not authority</strong><span>Work with the client instead of directing the conversation from above.</span></div><div class="info-card"><strong>Evocation, not persuasion</strong><span>Invite the client to voice their own reasons for considering change.</span></div><div class="info-card"><strong>Autonomy, not pressure</strong><span>Honor the client's choices, even when the counselor is concerned.</span></div><div class="info-card"><strong>Empathy, not judgment</strong><span>Seek to understand the client's experience and perspective.</span></div></div><div class="button-row center"><button class="primary-btn" data-action="mi-compare">See the Difference →</button></div>`);}
function miCompareScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Work with Daniel to compare two possible conversational approaches.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the Harbor Point training room" style="left:50%;transform:translateX(-50%);bottom:-3%;height:70vh"><button class="character-hotspot" type="button" aria-label="Discuss counseling approaches with Daniel" data-action="mi-compare" style="left:50%;transform:translateX(-50%);bottom:2%;width:30%;height:64%"></button></div></section>`;}
function miCompare(){openModal(`<h2>Directing or Guiding?</h2>${portrait(IMG.danielHead,'Daniel',"When people feel pressured to change, they may defend why they don't want to change. MI takes a different path: we listen, guide, and help clients hear their own motivations.")}<div class="teaching-card"><h3>Compare These Two Conversations</h3><div class="info-grid"><div class="info-card"><strong>Directing</strong><span>“You need to recognize that drinking every night is harming you. Let's make a plan to quit.”</span></div><div class="info-card"><strong>Guiding with MI</strong><span>“On the one hand, drinking helps you unwind. On the other, you've mentioned feeling worn out. How do you make sense of that?”</span></div></div><p>The guiding response reflects two sides of the person's experience without imposing a conclusion. This does not mean ignoring safety, clinical responsibilities, or treatment recommendations; information can be shared respectfully, often with permission.</p></div><h3>Quick Check</h3><p>Which statement best describes MI?</p><div class="question-block"><div class="choices"><button class="choice-btn" data-mi-check="0"><span class="choice-title">A.</span><span class="choice-text">Convince a client that the counselor's goal is the right one.</span></button><button class="choice-btn" data-mi-check="1"><span class="choice-title">B.</span><span class="choice-text">Agree with everything the client says to keep them comfortable.</span></button><button class="choice-btn" data-mi-check="2"><span class="choice-title">C.</span><span class="choice-text">Avoid discussing difficult health concerns with the client.</span></button><button class="choice-btn" data-mi-check="3"><span class="choice-title">D.</span><span class="choice-text">Draw out a client's own perspectives and reasons for considering change.</span></button></div><div id="miCheckFeedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}
function miCheck(button){const n=Number(button.dataset.miCheck),ok=n===3;button.classList.add(ok?'correct':'incorrect');const f=document.getElementById('miCheckFeedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>MI is a collaborative approach that evokes the client's own motivations while respecting their autonomy. The counselor can provide guidance without arguing or taking control.</p><div class="button-row"><button class="primary-btn" data-action="mi-santiago-scene">Practice with Santiago →</button></div>`:`<strong>Not quite. Try again.</strong><p>${n===0?'Persuading a client substitutes the counselor’s reasons for the client’s own motivations.':n===2?'MI allows honest conversations about difficult topics; it does not require avoiding concerns.':'Acceptance is not the same as agreeing with everything a client says.'} Look for the approach grounded in collaboration and the client's own reasons for change.</p>`;if(ok)document.querySelectorAll('[data-mi-check]').forEach(x=>x.disabled=true);}
function miSantiagoScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Now practice a guiding response with Santiago.</div><img class="character" src="${IMG.santiagoGuarded}" alt="Santiago looking guarded during the conversation" style="left:50%;transform:translateX(-50%);bottom:-3%;height:73vh"><button class="character-hotspot" type="button" aria-label="Continue the conversation with Santiago" data-action="mi-santiago-practice" style="left:50%;transform:translateX(-50%);bottom:2%;width:33%;height:67%"></button></div></section>`;}
function miSantiagoPractice(){openModal(`<h2>Put MI Into Practice</h2><div class="quote-card quote-with-headshot"><img src="${IMG.santiagoHead}" alt="Santiago talking"><div><strong>Santiago</strong><p>“Elena, my partner, says I drink too much. But my job is stressful, and a few beers are the only thing that helps me relax. I don't know why everyone's on my case.”</p></div></div><p><strong>What could you say next?</strong> Choose the response most consistent with MI.</p><div class="question-block"><div class="choices"><button class="choice-btn" data-mi-practice="0"><span class="choice-title">A. Give advice immediately</span><span class="choice-text">“You should start exercising after work instead of drinking.”</span></button><button class="choice-btn" data-mi-practice="1"><span class="choice-title">B. Challenge him</span><span class="choice-text">“If your partner is worried, you must have a problem.”</span></button><button class="choice-btn" data-mi-practice="2"><span class="choice-title">C. Reflect and invite</span><span class="choice-text">“After a stressful day, drinking feels like one of the few ways you can unwind. What concerns, if any, do you have about it?”</span></button><button class="choice-btn" data-mi-practice="3"><span class="choice-title">D. Minimize the concern</span><span class="choice-text">“It sounds like everyone is overreacting. Let's not worry about drinking.”</span></button></div><div id="miPracticeFeedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}
function miPractice(button){const n=Number(button.dataset.miPractice),ok=n===2;button.classList.add(ok?'correct':'incorrect');const f=document.getElementById('miPracticeFeedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>You acknowledge what alcohol does for Santiago, then invite him to explore any concerns in his own words. You are not assuming he already wants to stop.</p><div class="quote-card quote-with-headshot"><img src="${IMG.santiagoHead}" alt="Santiago thinking"><div><strong>Santiago</strong><p>“I guess I don't like how tired I feel in the mornings. And Elena and I have been arguing more. But I still need some way to unwind.”</p></div></div><p>Notice that Santiago has started to describe both reasons to keep drinking and possible reasons to change. We will return to those statements later in the module.</p><div class="button-row"><button class="primary-btn" data-action="mi-finish">Learn More About MI →</button></div>`:`<strong>Try a more collaborative response.</strong><p>${n===0?'Even well-meant advice can get ahead of the client. First seek to understand his experience.':n===1?'Challenging Santiago could invite him to defend his drinking rather than explore it.':'Minimizing his concern misses an opportunity to understand the situation, and MI does not mean dismissing risks.'} Try reflecting his perspective and inviting his thoughts.</p>`;if(ok)document.querySelectorAll('[data-mi-practice]').forEach(x=>x.disabled=true);}
function miFinish(){closeModal();state.completed[1]=true;save();renderMenu();paceStart();}


// Section 3: The Spirit of Motivational Interviewing
const paceSeen=new Set();
function paceStart(){closeModal();setCurrent(2);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel will now introduce the mindset behind MI.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the Harbor Point training room" style="left:52%;transform:translateX(-50%);bottom:-3%;height:76vh"><button class="character-hotspot" type="button" data-action="pace-intro" aria-label="Listen to Daniel explain the spirit of MI" style="left:39%;bottom:3%;width:28%;height:67%"></button></div></section>`;}
function paceIntro(){openModal(`<h2>The Spirit of MI</h2>${portrait(IMG.danielHead,'Daniel','Before choosing a technique, remember how we approach the person. MI is a partnership, not something we do to a client.')}<p>The spirit of MI can be remembered as <strong>PACE</strong>: <strong>Partnership, Acceptance, Compassion, and Evocation</strong>. These guiding attitudes shape everything we say to Santiago.</p><div class="teaching-card"><strong>What does this mean in practice?</strong><p>We work <em>with</em> Santiago, respect his ability to choose, place his well-being first, and draw out his own ideas and motivations.</p></div><div class="button-row"><button class="primary-btn" data-action="pace-cards">Explore PACE →</button></div>`);}
const paceCards=[
 ['Partnership','Work together rather than taking charge.','Instead of “Here is what you need to do,” ask, “What would you like us to focus on today?”'],
 ['Acceptance','Respect Santiago’s worth, point of view, and autonomy.','You can take health risks seriously while acknowledging that decisions about change belong to Santiago.'],
 ['Compassion','Put Santiago’s welfare and needs first.','Attend to his stress and well-being, not merely whether he agrees with a treatment recommendation.'],
 ['Evocation','Draw out his existing reasons and resources for change.','Ask what he wants to be different instead of supplying reasons he should change.']
];
function paceCardsScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.office}')"><div class="scene-guide">Explore all four parts of PACE to see what they sound like with Santiago.</div><img class="character" src="${IMG.mariaFull}" alt="Maria introduces the PACE principles" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="pace-cards" aria-label="Explore PACE with Maria" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function paceCardsModal(){paceDraw();}
function paceDraw(){openModal(`<h2>Explore PACE</h2><p>Explore all four parts of PACE to see what they sound like with Santiago.</p><div class="info-grid static-explorer">${paceCards.map((c,i)=>`<div class="static-skill skill-${i}"><div class="static-icon" aria-hidden="true">${['🤝','💛','🫶','🌱'][i]}</div><h3>${c[0]}</h3><p>${c[1]}</p><div class="static-example">${c[2]}</div></div>`).join('')}</div><div class="button-row"><button class="primary-btn" data-action="process-intro">Continue to the Four Processes →</button></div>`);}
function paceSelect(b){const i=Number(b.dataset.paceCard);paceSeen.add(i);const c=paceCards[i];b.querySelector('.choice-title').textContent=c[0]+' ✓';b.classList.add('visited');document.getElementById('paceDetail').innerHTML=`<strong>${c[0]}</strong><p>${c[2]}</p>`;const lead=modalContent.querySelector('h2 + p');if(lead)lead.innerHTML=`Select each principle to see how it shapes a conversation. <strong>${paceSeen.size} of 4 explored.</strong>`;const next=modalContent.querySelector('[data-action="process-scene"]');if(next)next.disabled=paceSeen.size<4;}
function processScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel will show you the four processes that guide an MI conversation.</div><img class="character" src="${IMG.danielFull}" alt="Daniel teaching the four MI processes" style="left:52%;transform:translateX(-50%);bottom:-4%;height:76vh"><button class="character-hotspot" type="button" data-action="process-intro" aria-label="Hear Daniel explain the four MI processes" style="left:39%;bottom:3%;width:28%;height:67%"></button></div></section>`;}
function processIntro(){openModal(`<h2>The Four Processes of MI</h2>${portrait(IMG.danielHead,'Daniel','PACE describes the spirit of MI. Four overlapping processes help us put that spirit into practice during a conversation.')}<div class="info-grid"><div class="info-card"><strong>1. Engaging</strong><span>Build trust and a working relationship. Listen to understand Santiago’s perspective.</span></div><div class="info-card"><strong>2. Focusing</strong><span>Agree on an area for discussion or change, rather than imposing your own agenda.</span></div><div class="info-card"><strong>3. Evoking</strong><span>Invite Santiago to voice his own reasons, hopes, and concerns about change.</span></div><div class="info-card"><strong>4. Planning</strong><span>When he is ready, collaborate on a possible next step. Do not rush this stage.</span></div></div><div class="callout mi-process-callout">The processes are not a rigid checklist. You may return to the Engaging or Focusing parts as the conversation develops.</div><div class="button-row"><button class="primary-btn" data-action="process-check">Try a Quick Check →</button></div>`);}
function processCheckScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.assessmentRoom}')"><div class="scene-title-card" style="top:20%;left:8%;max-width:620px"><span class="mini-label">Knowledge check</span><h2>Which Process Comes Next?</h2><p>Explore how to respond when a new client begins sharing uncertainty.</p><div class="button-row"><button class="primary-btn" data-action="process-check">Begin Check →</button></div></div></div></section>`;}
function processCheck(){openModal(`<h2>Identify the MI Process</h2><p>You have greeted Santiago. He says, “I came because my doctor suggested it. I don't know what I'm supposed to talk about.” What is the best immediate priority?</p><div class="question-block"><div class="choices"><button class="choice-btn" data-process-answer="0"><span class="choice-title">A. Planning</span><span class="choice-text">Give him a detailed alcohol reduction plan.</span></button><button class="choice-btn" data-process-answer="1"><span class="choice-title">B. Evoking</span><span class="choice-text">Ask him to promise a specific change immediately.</span></button><button class="choice-btn" data-process-answer="2"><span class="choice-title">C. Engaging</span><span class="choice-text">Understand his perspective and help him feel heard.</span></button><button class="choice-btn" data-process-answer="3"><span class="choice-title">D. Focusing</span><span class="choice-text">Tell him that alcohol must be today's topic.</span></button></div><div id="processFeedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}
function processAnswer(b){const n=Number(b.dataset.processAnswer),ok=n===2;b.classList.add(ok?'correct':'incorrect');const f=document.getElementById('processFeedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>Engaging comes first. Early in the conversation, a genuine effort to understand Santiago helps build the relationship. Focusing and evoking can follow collaboratively; planning comes when there is readiness.</p><div class="button-row"><button class="primary-btn" data-action="pace-santiago-scene">Apply PACE with Santiago →</button></div>`:`<strong>Try again.</strong><p>${n===0?'Planning a change before listening gets ahead of Santiago.':n===1?'A promise is not the same as evoking the client’s motivation.':'A counselor-selected agenda could undermine the partnership.'} Think about what establishes trust at a first visit.</p>`;if(ok)modalContent.querySelectorAll('[data-process-answer]').forEach(x=>x.disabled=true);}
function paceSantiagoScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Santiago has a concern he wants to share with you.</div><img class="character" src="${IMG.santiagoThoughtful}" alt="Santiago considering his situation" style="left:50%;transform:translateX(-50%);bottom:-3%;height:73vh"><button class="character-hotspot" type="button" data-action="pace-santiago" aria-label="Respond to Santiago" style="left:39%;bottom:2%;width:25%;height:66%"></button></div></section>`;}
function paceSantiago(){openModal(`<h2>PACE in Conversation</h2>${portrait(IMG.santiagoHead,'Santiago','I know Elena is worried, but drinking helps me get through stressful days. I don’t want anyone telling me what I have to do.')}<p><strong>Which response best demonstrates partnership, acceptance, compassion, and evocation?</strong></p><div class="question-block"><div class="choices"><button class="choice-btn" data-pace-answer="0"><span class="choice-title">A. Persuade</span><span class="choice-text">“You need to accept that alcohol is making things worse.”</span></button><button class="choice-btn" data-pace-answer="1"><span class="choice-title">B. Take over</span><span class="choice-text">“I’ve worked with people like you. Follow my plan and you’ll be fine.”</span></button><button class="choice-btn" data-pace-answer="2"><span class="choice-title">C. Reflect and invite</span><span class="choice-text">“Drinking gives you some relief, and you want to make your own decisions. What, if anything, would you like to be different?”</span></button><button class="choice-btn" data-pace-answer="3"><span class="choice-title">D. Ignore the concern</span><span class="choice-text">“If you don't want to talk about drinking, we can pretend it isn't an issue.”</span></button></div><div id="paceFeedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}
function paceAnswer(b){const n=Number(b.dataset.paceAnswer),ok=n===2;b.classList.add(ok?'correct':'incorrect');const f=document.getElementById('paceFeedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>You reflect Santiago’s experience without judgment, respect his autonomy, and invite his own goals. That response shows the spirit of MI in action.</p>${portrait(IMG.santiagoHead,'Santiago','I’m not ready to say I need treatment. But I do wish Elena and I weren’t arguing so much.') }<p>This is an opening to listen for Santiago’s own reasons and priorities, not a signal to push for immediate commitment.</p><div class="button-row"><button class="primary-btn" data-action="pace-finish">Learn About Readiness →</button></div>`:`<strong>Try a different approach.</strong><p>${n===0?'Confrontation may increase defensiveness.':n===1?'Expert-driven directions leave little room for Santiago’s own values and ideas.':'Acceptance does not mean ignoring concerns or pretending risk is absent.'} Look for a response that conveys understanding and invites him to guide the conversation.</p>`;if(ok)modalContent.querySelectorAll('[data-pace-answer]').forEach(x=>x.disabled=true);}
function paceFinish(){closeModal();state.completed[2]=true;save();renderMenu();readinessStart();}


// Section 4: Understanding Readiness and Human Needs
const needCards=[
 ['Physiological needs','Food, rest, water, and other basic bodily needs','Santiago describes poor sleep and feeling exhausted.'],
 ['Safety','Physical safety, stable shelter, resources, and predictability','Job stress and worries about finances can make change feel risky.'],
 ['Belonging','Connection, friendship, and meaningful relationships','He values Elena but feels judged during conversations about alcohol.'],
 ['Esteem','Competence, respect, confidence, and a sense of accomplishment','He is proud of working and supporting himself.'],
 ['Self-actualization','Developing potential and pursuing personally meaningful goals','He may want a healthier routine and a future that fits his values.']
];

function readinessIntro(){openModal(`<h2>Readiness Is More Than Willpower</h2>${portrait(IMG.danielHead,'Daniel','A person may care about change and still face practical, emotional, or relational barriers. Our first job is to understand.')}<p>Santiago has mentioned stress, sleep problems, and conflict with Elena. Those circumstances may affect what feels urgent, safe, or possible for him.</p><div class="teaching-card"><strong>Maslow’s Hierarchy of Needs</strong><p>Maslow’s Hierarchy of Needs is a psychological theory that explains how human motivation is influenced by five levels of needs. At the foundation are physiological needs, such as food, water, sleep, and shelter, followed by safety needs, including physical security, stability, and protection. The third level involves love and belonging, such as relationships, friendships, and social connections. Next are esteem needs, which include confidence, achievement, respect, and feeling valued by others. At the top is self-actualization, or reaching one’s full potential through personal growth, purpose, and fulfillment. Maslow suggested that people are generally more motivated to pursue higher-level needs when their basic needs are reasonably met, although individuals can experience and pursue needs at multiple levels simultaneously.</p><p>This hierarchy can be a conversation aid for considering what matters in someone’s life, not a diagnostic test or a rigid ladder that every person follows in order.</p><img src="https://cestuve.github.io/Module11/Maslow.png" alt="Maslow’s Hierarchy of Needs illustrated as a pyramid with five levels" class="maslow-figure"><p class="small muted">Note: The hierarchy is a framework for discussion, not a fixed rule for how every person is motivated.</p></div><p>In MI, we explore the client’s own priorities rather than deciding which needs are most important for them.</p><div class="button-row"><button class="primary-btn" data-action="readiness-needs">Explore the five needs →</button></div>`);}

 ['O','Open-ended questions','Invite the client to tell their story, rather than limiting them to yes/no.','“What do you notice about how drinking affects your evenings?”','A question such as “You know drinking is bad for you, right?” leads the client and invites defensiveness.'],
 ['A','Affirmations','Notice real effort, values, strengths, or positive steps; avoid empty praise.','“Even though you weren’t sure about coming, you made time to be here.”','An affirmation names something genuine rather than grading the client as “good” or “bad.”'],
 ['R','Reflective listening','Offer a statement that checks your understanding of what the client means or feels.','“After stressful shifts, drinking feels like the one way you can switch off.”','A reflection is usually a statement, not another question. The client can confirm or correct it.'],
 ['S','Summaries','Gather important ideas, especially both sides of ambivalence and any client-stated reasons for change.','“Drinking helps you unwind, and you’re also noticing mornings have become harder. Did I get that right?”','A summary does not add a new agenda or force the client toward a plan.']
];

function empathyIntro(){openModal(`<h2>Listen for Meaning and Feeling</h2>${portrait(IMG.danielHead,'Daniel','When Santiago speaks, pay attention to both what happened and how it feels to him. We do not have to agree with him to understand him.')}<p>Reflective listening communicates your best understanding of the client's meaning or emotion and gives the client a chance to confirm or correct it. It builds rapport and can help clients explore their experiences more fully.</p><div class="teaching-card"><strong>Empathy Versus Sympathy</strong><p><strong>Empathy:</strong> Seek to understand Santiago's experience and communicate that understanding without judgment.</p><p><strong>Sympathy:</strong> Express feeling sorry for him; it may unintentionally create distance or shift attention away from his perspective.</p><p>Neither empathy nor reflection requires agreeing with everything Santiago says.</p></div><div class="button-row"><button class="primary-btn" data-action="empathy-choice-scene">Try an Empathic Response →</button></div>`);}

function reflectionTeach(){openModal(`<h2>Two Levels of Reflective Listening</h2>${portrait(IMG.danielHead,'Daniel','A simple reflection shows you heard the client. A complex reflection offers a careful guess about the underlying meaning or feeling.')}<div class="quote-card">Santiago: “Work's been exhausting. When I get home, I just want everything to quiet down.”</div><div class="info-grid"><div class="info-card"><strong>Simple reflection</strong><span>“By the time you get home, you're worn out and looking for a break.”</span></div><div class="info-card"><strong>Complex reflection</strong><span>“You feel pulled in so many directions that having a moment of relief has become really important.”</span></div></div><p>A complex reflection is an informed <em>guess</em>, not a diagnosis. If you miss the mark, listen to the correction and adjust.</p><div class="button-row"><button class="primary-btn" data-action="reflection-check">Practice Reflecting Feelings →</button></div>`);}

function empathyFinal(b){let ok=b.dataset.empathyFinal==='2',f=document.getElementById('empathy-final-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>You made room for both sides of Santiago's experience, without demanding a decision.</p>${portrait(IMG.santiagoHead,'Santiago',"Yeah. That's exactly it. I don't like fighting with Elena, but after work I just want something that takes the edge off.")}<p>His reply opens the door to exploring ambivalence in the next section.</p><div class="button-row"><button class="primary-btn" data-action="empathy-finish">Explore Ambivalence →</button></div>`:`<strong>Stay with his experience.</strong><p>Advice and persuasion can interrupt the conversation. Reflect both the relief he experiences and the concern he has raised.</p>`;if(ok)document.querySelectorAll('[data-empathy-final]').forEach(x=>x.disabled=true);}

// Section 7 — Ambivalence & Change Talk
function ambStart(){closeModal();setCurrent(6);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel introduces ambivalence: wanting change and wanting things to stay the same. Then listen for both sides of Santiago’s experience before helping him consider a next step.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the Harbor Point training room" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="amb-intro" aria-label="Talk with character" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function ambIntro(){openModal(`<h2>Ambivalence Is Normal</h2>${portrait(IMG.danielHead,'Daniel','A client can see reasons to change and reasons to stay the same. That is ambivalence, not proof that they are unwilling or incapable.')}<div class="quote-card">Santiago: “Drinking helps me switch off after work. But I hate how often Elena and I fight about it.”</div><p>Rather than debating which side is right, MI invites us to listen carefully to both sides and let the client explore their own priorities.</p><div class="info-grid"><div class="info-card"><strong>Change talk</strong><span>Client language that favors movement toward change.</span></div><div class="info-card"><strong>Sustain talk</strong><span>Client language that favors continuing the current behavior.</span></div></div><p>Neither is a label for the person. They describe what the client says at a particular moment.</p><div class="button-row"><button class="primary-btn" data-action="amb-sort">Practice listening →</button></div>`);}
function ambDanielScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel asks you to listen for the direction of Santiago's own words. Identify what Santiago is expressing without deciding for him.</div><img class="character" src="${IMG.danielFull}" alt="Daniel leading a training activity" style="left:50%;transform:translateX(-50%);bottom:-3%;height:76vh"><button class="character-hotspot" type="button" data-action="amb-sort" aria-label="Talk with character" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
let ambIndex=0;
const ambItems=[
 {say:'“A few beers help me calm down when I get home.”',kind:'sustain',why:'Santiago is explaining a benefit of continuing to drink.'},
 {say:'“I wish Elena and I could stop fighting about my drinking.”',kind:'change',why:'He is naming something he wants to be different, although he has not promised to change.'},
 {say:'“I still get to work on time, so I do not see why this is a problem.”',kind:'sustain',why:'He is making a case for keeping things as they are.'},
 {say:'“Maybe cutting back would help me sleep better.”',kind:'change',why:'He is offering his own possible reason for change.'}
];
function ambSort(){ambIndex=0;ambQuestion();}
function ambQuestion(){let q=ambItems[ambIndex];openModal(`<h2>Listen for Change or Sustain Talk</h2><div class="teaching-card"><strong>Change talk</strong><p>Statements that favor moving toward change, such as a wish, reason, ability, or intention to change.</p><strong>Sustain talk</strong><p>Statements that favor continuing the current behavior or express reasons not to change.</p></div>${portrait(IMG.danielHead,'Daniel','Listen to what Santiago is saying without adding judgment.')}<span class="step-pill">Statement ${ambIndex+1} of ${ambItems.length}</span><div class="quote-card">${q.say}</div><p><strong>How would you classify this statement?</strong></p><div class="question-block"><div class="choices"><button class="choice-btn" data-amb-kind="change">Change talk</button><button class="choice-btn" data-amb-kind="sustain">Sustain talk</button></div><div class="inline-question-feedback" id="amb-sort-feedback" aria-live="polite"></div></div>`);}
function ambSortAnswer(b){let q=ambItems[ambIndex],ok=b.dataset.ambKind===q.kind,f=document.getElementById('amb-sort-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>That's right.</strong><p>${q.why}</p><div class="button-row"><button class="primary-btn" data-action="${ambIndex===ambItems.length-1?'amb-contrast-scene':'amb-next'}">${ambIndex===ambItems.length-1?'Explore Both Sides →':'Next Statement →'}</button></div>`:`<strong>Try again.</strong><p>Ask: is Santiago describing a reason to make a change or a reason to continue as he is?</p>`;if(ok)document.querySelectorAll('[data-amb-kind]').forEach(x=>x.disabled=true);}
function ambNext(){ambIndex++;ambQuestion();}
function ambContrastScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Santiago feels pulled in two directions. Reflect on both, rather than arguing for one.</div><img class="character" src="${IMG.santiagoThoughtful}" alt="Santiago thinking about his drinking and relationship" style="left:50%;transform:translateX(-50%);bottom:-3%;height:75vh"><button class="character-hotspot" data-action="amb-contrast" aria-label="Hear Santiago's ambivalence" style="left:37%;bottom:3%;width:27%;height:64%"></button></div></section>`;}
function ambContrast(){openModal(`<h2>Reflect Both Sides</h2>${portrait(IMG.santiagoHead,'Santiago',"I don't want to give up the only thing that helps me relax. But I miss when Elena and I could talk without fighting.")}<p><strong>Which response best supports further exploration?</strong></p><div class="question-block"><div class="choices"><button class="choice-btn" data-amb-contrast="0">“Drinking gives you relief, and you're missing the connection you used to have with Elena.”</button><button class="choice-btn" data-amb-contrast="1">“Your relationship matters more than drinking, so you should quit.”</button><button class="choice-btn" data-amb-contrast="2">“If drinking helps you relax, perhaps there isn't much to discuss.”</button></div><div class="inline-question-feedback" id="amb-contrast-feedback" aria-live="polite"></div></div>`);}
function ambContrastAnswer(b){let ok=b.dataset.ambContrast==='0',f=document.getElementById('amb-contrast-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>You acknowledged the relief Santiago gets from drinking and the relationship he values, without choosing for him.</p>${portrait(IMG.santiagoHead,'Santiago',"Correct I don't know what I'd do after work instead, but I don't like how things are going at home.")}<p>Notice that Santiago has offered another reason to explore change. The next step is curiosity, not a lecture.</p><div class="button-row"><button class="primary-btn" data-action="amb-evoke-scene">Ask a Follow-Up →</button></div>`:`<strong>Try a reflection rather than persuasion or dismissal.</strong><p>MI makes room for both sides of ambivalence. Choose a statement that keeps the conversation open.</p>`;if(ok)document.querySelectorAll('[data-amb-contrast]').forEach(x=>x.disabled=true);}
function ambEvokeScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Santiago has voiced a possible reason for change. Where can the conversation go next?</div><img class="character" src="${IMG.santiagoTalking}" alt="Santiago talking with the counselor" style="left:50%;transform:translateX(-50%);bottom:-3%;height:76vh"><button class="character-hotspot" data-action="amb-evoke" aria-label="Ask Santiago a follow-up question" style="left:37%;bottom:3%;width:27%;height:65%"></button></div></section>`;}
function ambEvoke(){openModal(`<h2>Invite Santiago to Say More</h2>${portrait(IMG.santiagoHead,'Santiago',"I don't like how things are going at home.")}<p><strong>What follow-up is most likely to evoke his own reasons for change?</strong></p><div class="question-block"><div class="choices"><button class="choice-btn" data-amb-evoke="0">“Why haven't you stopped drinking if your relationship is important?”</button><button class="choice-btn" data-amb-evoke="1">“What would you most like to be different between you and Elena?”</button><button class="choice-btn" data-amb-evoke="2">“Would you agree to stop drinking tonight?”</button></div><div class="inline-question-feedback" id="amb-evoke-feedback" aria-live="polite"></div></div>`);}
function ambEvokeAnswer(b){let ok=b.dataset.ambEvoke==='1',f=document.getElementById('amb-evoke-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>An open question draws out what matters to Santiago. It does not pressure him to announce a commitment before he is ready.</p>${portrait(IMG.santiagoHead,'Santiago',"I'd like us to be able to spend an evening together without arguing. I miss that.")}<div class="button-row"><button class="primary-btn" data-action="amb-finish">Examine Motivation Expression →</button></div>`:`<strong>Try again.</strong><p>Look for an open question that lets Santiago elaborate on his own concern without defending his behavior or making a premature commitment.</p>`;if(ok)document.querySelectorAll('[data-amb-evoke]').forEach(x=>x.disabled=true);}
function ambFinish(){closeModal();state.completed[6]=true;save();renderMenu();showCheckpoint('connection','darnStart');}


// Section 8: DARN-CAT and Evoking Change Talk
function darnStart(){closeModal();setCurrent(7);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel helps you notice the different ways clients express motivation.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the Harbor Point training room" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="darn-intro" aria-label="Talk with character" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function darnIntro(){openModal(`<h2>Listen for the Language of Change</h2>${portrait(IMG.danielHead,'Daniel','Change talk can be tentative. Our job is to recognize it and make room for Santiago to say more, not force him into a promise.')}<p><strong>DARN-CAT</strong> describes seven forms of client change talk. <strong>DARN</strong> often describes reasons and motivations for considering change. <strong>CAT</strong> describes language that signals movement toward action.</p><div class="info-grid"><div class="info-card"><strong>DARN · Preparatory</strong><span>Desire, Ability, Reasons, Need</span></div><div class="info-card"><strong>CAT · Mobilizing</strong><span>Commitment, Activation, Taking steps</span></div></div><div class="callout pace-spaced">A statement is not a clinical diagnosis or a guarantee of action. Listen for what Santiago actually says.</div><div class="button-row"><button class="primary-btn" data-action="darn-cards">Explore DARN-CAT →</button></div>`);}
function darnCardsScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel will help you explore all seven types of change talk.</div><img class="character" src="${IMG.danielFull}" alt="Daniel leading the DARN-CAT activity" style="left:50%;transform:translateX(-50%);bottom:-3%;height:75vh"><button class="character-hotspot" type="button" data-action="darn-cards" aria-label="Explore DARN-CAT with Daniel" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
const darnCards=[
 {letter:'D',name:'Desire',example:'“I wish evenings at home felt calmer.”',purpose:'Wanting something to change.'},
 {letter:'A',name:'Ability',example:'“I could try having a few alcohol-free evenings.”',purpose:'Believing change might be possible.'},
 {letter:'R',name:'Reasons',example:'“I might sleep better if I drank less.”',purpose:'Offering a specific benefit of change.'},
 {letter:'N',name:'Need',example:'“Something needs to change before this gets worse.”',purpose:'Expressing urgency or necessity.'},
 {letter:'C',name:'Commitment',example:'“I will talk with Elena about trying a change.”',purpose:'Stating an intention to act.'},
 {letter:'A',name:'Activation',example:'“I’m ready to think about what I could do first.”',purpose:'Expressing readiness or willingness, without having acted yet.'},
 {letter:'T',name:'Taking steps',example:'“Yesterday I went home and skipped my usual beers.”',purpose:'Describing a step already taken.'}
];
let darnSeen=new Set();
function darnCardsModal(){darnSeen=new Set();darnRenderCards();}
function darnRenderCards(){openModal(`<h2>Seven Kinds of Change Talk</h2>${portrait(IMG.danielHead,'Daniel','Notice how each kind of statement expresses motivation in a different way.')}<div class="info-grid static-explorer">${darnCards.map((c,i)=>`<div class="static-skill skill-${i%5}"><div class="static-icon" aria-hidden="true">${['💭','💪','🌻','❗','🗓️','🚦','👣'][i]}</div><h3>${c.letter} — ${c.name}</h3><p>${c.purpose}</p><div class="static-example">${c.example}</div></div>`).join('')}</div><div class="button-row"><button class="primary-btn" data-action="darn-quiz">Try Daniel's Challenge →</button></div>`);}
function darnCardSelect(b){const i=Number(b.dataset.darnCard);if(!Number.isInteger(i)||i<0||i>=darnCards.length)return;darnSeen.add(i);darnRenderCards();const c=darnCards[i];const detail=document.getElementById('darn-card-detail');if(detail)detail.innerHTML=`<div class="teaching-card"><strong>${c.name}: ${c.purpose}</strong><p>${c.example}</p></div>`;}
function darnQuizScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel asks you to identify what Santiago’s words reveal.</div><img class="character" src="${IMG.danielFull}" alt="Daniel presents a DARN-CAT challenge" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="darn-quiz" aria-label="Practice DARN-CAT with Daniel" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
const darnQuestions=[
 {q:'“I want Elena and me to have fewer arguments.”',answer:'Desire',why:'He expresses a wish, but not a plan or commitment.'},
 {q:'“Maybe I could go two nights without drinking.”',answer:'Ability',why:'He describes something he believes might be possible.'},
 {q:'“Cutting back might help me wake up with more energy.”',answer:'Reasons',why:'He names a benefit of change.'},
 {q:'“I really need to figure this out.”',answer:'Need',why:'He expresses necessity rather than a specific action.'},
 {q:'“I’m going to try an alcohol-free evening on Thursday.”',answer:'Commitment',why:'He states a specific intention to act.'},
 {q:'“I’m ready to look at a few options.”',answer:'Activation',why:'He expresses readiness, without yet describing an action taken.'},
 {q:'“I poured out the beer I had left last night.”',answer:'Taking steps',why:'He describes an action he already took.'}
];
let darnQIndex=0;
function darnQuiz(){darnQIndex=0;darnShowQ();}
function darnShowQ(){const q=darnQuestions[[2,5,0,6,3,1,4][darnQIndex]];openModal(`<h2>Recognize DARN-CAT</h2>${portrait(IMG.danielHead,'Daniel','Focus on the exact language Santiago uses.')}<span class="step-pill">Question ${darnQIndex+1} of ${darnQuestions.length}</span><div class="quote-card">${q.q}</div><p><strong>Which type of change talk is this?</strong></p><details class="darn-reference" open><summary>DARN-CAT Reference — review all seven types</summary><div class="darn-reference-grid">${darnCards.map(c=>`<div><strong>${c.letter} — ${c.name}</strong><span>${c.purpose}</span><small>${c.example}</small></div>`).join('')}</div></details><div class="choices">${['Desire','Ability','Reasons','Need','Commitment','Activation','Taking steps'].map((x,i)=>`<button class="choice-btn" data-darn-answer="${x}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div class="inline-question-feedback" id="darn-qfeedback" aria-live="polite"></div>`);}
function darnAnswer(b){const q=darnQuestions[[2,5,0,6,3,1,4][darnQIndex]],ok=b.dataset.darnAnswer===q.answer,f=document.getElementById('darn-qfeedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>${q.why}</p><div class="button-row"><button class="primary-btn" data-action="${darnQIndex===darnQuestions.length-1?'darn-strategies-scene':'darn-next'}">${darnQIndex===darnQuestions.length-1?'Practice Evoking Change Talk →':'Next Statement →'}</button></div>`:`<strong>Not quite. Try again.</strong><p>Consider whether he is wishing, believing he can, giving a reason, expressing need, committing, getting ready, or describing a step already completed.</p>`;if(ok)document.querySelectorAll('[data-darn-answer]').forEach(x=>x.disabled=true);}
function darnNext(){darnQIndex++;darnShowQ();}
function darnStrategiesScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Practice drawing out Santiago’s own motivation. Good questions invite Santiago to explore his reasons, values, and possible next steps.</div><img class="character" src="${IMG.danielFull}" alt="Daniel introduces change talk strategies" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="darn-strategies" aria-label="Talk with Daniel about evoking change talk" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function darnStrategies(){openModal(`<h2>Strategies for Evoking Change Talk</h2>${portrait(IMG.danielHead,'Daniel','Ask questions that help Santiago make his own case for change. Then reflect and invite him to elaborate.')}<div class="info-grid"><div class="info-card"><strong>Ask for elaboration</strong><span>“What makes that important to you?”</span></div><div class="info-card"><strong>Look back / look forward</strong><span>“When did evenings feel different?” “What would you like next month to look like?”</span></div><div class="info-card"><strong>Explore goals and values</strong><span>“What matters most to you about your relationship with Elena?”</span></div><div class="info-card"><strong>Use a change ruler</strong><span>Ask how important a possible change feels on a 0–10 scale.</span></div></div><p>Other strategies include asking for examples and exploring the good and less-good aspects of the current behavior. Always follow Santiago's lead and avoid treating these questions as persuasion tricks.</p><div class="button-row"><button class="primary-btn" data-action="darn-ruler-scene">Try a Change Ruler →</button></div>`);}
function darnRulerScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Santiago considers the importance of making a change. Explore his own reasons without arguing him toward a higher number.</div><img class="character" src="${IMG.santiagoTalking}" alt="Santiago talking about possible change" style="left:50%;transform:translateX(-50%);bottom:-3%;height:75vh"><button class="character-hotspot" type="button" data-action="darn-ruler" aria-label="Talk with Santiago about what matters to him" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function darnRuler(){openModal(`<h2>A Conversation About Importance</h2>${portrait(IMG.santiagoHead,'Santiago','I guess cutting back matters some. If zero is not important and ten is extremely important, maybe I’m at a four.')}<p><strong>Which follow-up best evokes his reasons for change?</strong></p><div class="question-block"><div class="choices"><button class="choice-btn" data-darn-ruler="0">“Only a four? Don't you think your relationship deserves a higher score?”</button><button class="choice-btn" data-darn-ruler="1">“What would convince you to say ten?”</button><button class="choice-btn" data-darn-ruler="2">“Why a four and not a zero?”</button></div><div id="darn-ruler-feedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}
function darnRulerAnswer(b){const ok=b.dataset.darnRuler==='2',f=document.getElementById('darn-ruler-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>Asking why the number is not lower invites Santiago to explain what already matters to him, rather than defend why it is not higher.</p>${portrait(IMG.santiagoHead,'Santiago','Because I do want things to be better with Elena. And I’m tired of feeling worn out in the morning.')}<p><strong>What could you say next?</strong></p><div class="choices"><button class="choice-btn" data-darn-follow="0">“So you'll stop drinking this week, then?”</button><button class="choice-btn" data-darn-follow="1">“You're noticing that your relationship and your energy matter to you. What do you make of that?”</button><button class="choice-btn" data-darn-follow="2">“You should tell Elena she was right.”</button></div><div id="darn-follow-feedback" class="inline-question-feedback" aria-live="polite"></div>`:`<strong>Try again.</strong><p>Rather than persuading Santiago to give a higher number, invite him to explain why change already matters at least a little.</p>`;if(ok)document.querySelectorAll('[data-darn-ruler]').forEach(x=>x.disabled=true);}
function darnFollowAnswer(b){const ok=b.dataset.darnFollow==='1',f=document.getElementById('darn-follow-feedback');f.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');f.innerHTML=ok?`<strong>Correct</strong><p>You reflected Santiago's own reasons for considering change and left the next step in his hands.</p><div class="button-row"><button class="primary-btn" data-action="darn-finish">Learn About Discord →</button></div>`:`<strong>Try again.</strong><p>Choose a response that reflects his change talk and invites exploration, without assuming he is ready to act.</p>`;if(ok)document.querySelectorAll('[data-darn-follow]').forEach(x=>x.disabled=true);}
function darnFinish(){closeModal();state.completed[7]=true;save();renderMenu();discordStart();}


// SECTION 9 — Responding to Discord
function discordStart(){closeModal();setCurrent(8);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">When Santiago feels judged, the relationship needs attention, not a stronger argument.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the training room" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="discord-intro" aria-label="Talk with character" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function discordIntro(){openModal(`<h2>When the Conversation Feels Like a Struggle</h2>${portrait(IMG.danielHead,'Daniel','MI does not mean winning an argument. When a client pushes back against us, pay attention to how we are working together.')}<div class="info-grid"><div class="info-card"><strong>Sustain talk</strong><span>Language in favor of keeping a behavior the same: “Drinking helps me relax.”</span></div><div class="info-card"><strong>Discord</strong><span>Strain in the helping relationship: “You’re not listening. You’ve already decided what I should do.”</span></div></div><p>Older MI resources sometimes call this resistance or recommend “rolling with resistance.” Contemporary MI makes a useful distinction: sustain talk is about change; discord is about the working relationship. Avoid labeling Santiago as a “resistant client.”</p><div class="callout">The righting reflex is the temptation to correct, persuade, or solve the problem before the client is ready.</div><div class="button-row"><button class="primary-btn" data-action="discord-daniel">Common counseling traps →</button></div>`);}
function discordDanielScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.community}')"><div class="scene-guide">Daniel helps you recognize common counseling traps.</div><img class="character" src="${IMG.danielFull}" alt="Daniel in the office" style="left:50%;transform:translateX(-50%);bottom:-3%;height:74vh"><button class="character-hotspot" type="button" data-action="discord-daniel" aria-label="Talk with character" style="left:37%;bottom:3%;width:27%;height:67%"></button></div></section>`;}
function discordDaniel(){openModal(`<h2>Before You Respond, Notice Your Instinct</h2>${portrait(IMG.danielHead,'Daniel','When I feel pressure to fix a problem quickly, I have to notice that urge. Clients are more likely to explore change when they feel heard and have choices.')}<div class="info-grid"><div class="info-card"><strong>Expert trap</strong><span>Acting as though the counselor has every answer.</span></div><div class="info-card"><strong>Premature focus</strong><span>Pushing for change before agreeing on what matters to the client.</span></div><div class="info-card"><strong>Confrontation</strong><span>Arguing about whether the client has a problem.</span></div><div class="info-card"><strong>Alternative</strong><span>Reflect, affirm autonomy, apologize for misunderstanding if needed, or shift focus.</span></div></div><p><strong>Quick check:</strong> Which statement is the clearest sign of discord?</p><div class="question-block"><div class="choices"><button class="choice-btn" data-discord-sort="0">“Beer helps me calm down after a shift.”</button><button class="choice-btn" data-discord-sort="1">“You're not hearing me. You're just like everyone else.”</button><button class="choice-btn" data-discord-sort="2">“I'd like to have more energy in the morning.”</button></div><div id="discord-sort-feedback" class="inline-question-feedback" aria-live="polite"></div></div>`);}

async function downloadPDF(){const prompts=reflectionPrompts.map(([key,question],i)=>['Personal Reflection '+(i+1),question,reflectionValue(key)]);const pageW=1275,pageH=1650,margin=92,contentW=pageW-margin*2;const pages=[];let canvas,ctx,y;const makePage=()=>{canvas=document.createElement('canvas');canvas.width=pageW;canvas.height=pageH;ctx=canvas.getContext('2d');ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,pageW,pageH);ctx.fillStyle='#243746';ctx.fillRect(0,0,pageW,166);ctx.fillStyle='#d7a74a';ctx.fillRect(0,166,pageW,10);ctx.fillStyle='#fff';ctx.font='700 38px Inter, Arial, sans-serif';ctx.fillText('Motivational Interviewing',margin,76);ctx.font='600 22px Inter, Arial, sans-serif';ctx.fillStyle='#dce9ee';ctx.fillText('Harbor Point · Module 11 Reflection Report',margin,128);y=232;ctx.font='500 19px Inter, Arial, sans-serif';ctx.fillStyle='#354f5c';ctx.fillText(`Completed: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,margin,y);y+=58};const wrap=(text,font,maxWidth)=>{ctx.font=font;const words=(text||'No response recorded.').toString().split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines};const add=async()=>{await new Promise(r=>canvas.toBlob(b=>{pages.push(b);r()},'image/jpeg',.9))};makePage();for(const [title,prompt,response] of prompts){const t=wrap(title,'800 25px Inter, Arial, sans-serif',contentW-48),p=wrap(prompt,'700 19px Inter, Arial, sans-serif',contentW-48),r=wrap(response,'500 21px Inter, Arial, sans-serif',contentW-48);const boxH=38+t.length*33+12+p.length*28+18+r.length*31+32;if(y+boxH>pageH-90){await add();makePage()}ctx.fillStyle='#fffdfa';roundRect(ctx,margin,y,contentW,boxH,20,true,false);ctx.strokeStyle='#dfd5c7';ctx.lineWidth=3;roundRect(ctx,margin,y,contentW,boxH,20,false,true);let yy=y+38;ctx.fillStyle='#243746';ct
